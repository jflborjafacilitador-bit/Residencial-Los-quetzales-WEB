name: Deploy to Hostinger

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get update -y && sudo apt-get install -y lftp openssh-client

      - name: Desplegar a Hostinger
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASS: ${{ secrets.HOSTINGER_PASSWORD }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: bash scripts/deploy-hostinger.sh

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin — Residencial Los Quetzales</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Lato',sans-serif;background:#0f1117;color:#e0e0e0;min-height:100vh;}

/* LOGIN */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0d1f0d 0%,#1a3a1a 50%,#0d1117 100%);}
.login-card{background:rgba(255,255,255,0.04);border:1px solid rgba(141,198,63,0.2);border-radius:20px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 24px 80px rgba(0,0,0,0.5);backdrop-filter:blur(10px);text-align:center;}
.login-logo{font-family:'Poppins',sans-serif;font-weight:800;font-size:14px;color:#8DC63F;letter-spacing:1px;margin-bottom:8px;}
.login-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:24px;color:#fff;margin-bottom:4px;}
.login-sub{font-size:13px;color:#555;margin-bottom:36px;}
.login-label{display:block;font-size:11px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;text-align:left;}
.login-input{width:100%;padding:12px 16px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.1);border-radius:10px;color:#fff;font-size:14px;font-family:'Lato',sans-serif;outline:none;transition:.2s;margin-bottom:16px;}
.login-input:focus{border-color:#8DC63F;background:rgba(141,198,63,0.05);}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#2E8B2E,#8DC63F);border:none;border-radius:10px;color:#fff;font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;cursor:pointer;transition:.2s;box-shadow:0 4px 20px rgba(46,139,46,0.35);}
.login-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 28px rgba(46,139,46,0.5);}
.login-btn:disabled{opacity:.5;cursor:not-allowed;}
.login-err{color:#ef4444;font-size:13px;margin-top:12px;display:none;padding:10px;background:rgba(239,68,68,0.1);border-radius:8px;}

/* TOPBAR */
#adminScreen{display:none;}
.topbar{background:linear-gradient(135deg,#1a3a1a,#0d1f0d);border-bottom:2px solid rgba(141,198,63,0.25);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-brand{font-family:'Poppins',sans-serif;font-weight:800;font-size:16px;color:#8DC63F;}
.topbar-user{font-size:11px;color:#555;margin-top:2px;}
.topbar-actions{display:flex;gap:10px;align-items:center;}
.realtime-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#22c55e;font-family:'Poppins',sans-serif;font-weight:600;}
.realtime-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:pulse-green 2s ease-in-out infinite;}
@keyframes pulse-green{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(1.3);}}
.btn-outline-sm{padding:8px 16px;background:transparent;border:1.5px solid #333;border-radius:8px;color:#666;font-family:'Poppins',sans-serif;font-size:12px;cursor:pointer;transition:.2s;}
.btn-outline-sm:hover{border-color:#ef4444;color:#ef4444;}

/* WRAP */
.admin-wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px;}

/* STATS */
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:28px;}
.stat-box{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:16px 18px;text-align:center;}
.stat-n{font-family:'Poppins',sans-serif;font-weight:800;font-size:26px;color:#8DC63F;}
.stat-n.red{color:#ef4444;}
.stat-n.sm{font-size:20px;}
.stat-l{font-size:10px;color:#555;margin-top:3px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;}

/* TABS */
.tabs{display:flex;gap:8px;margin-bottom:20px;}
.tab{padding:10px 22px;border-radius:30px;border:1.5px solid rgba(255,255,255,0.08);background:transparent;color:#666;font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:.2s;}
.tab.active-g{background:#152a15;border-color:#2E8B2E;color:#8DC63F;}
.tab.active-o{background:#2a1200;border-color:#e84a10;color:#e84a10;}

/* SEARCH */
.search-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.search-input{flex:1;min-width:160px;padding:9px 14px;background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.08);border-radius:8px;color:#fff;font-size:13px;outline:none;transition:.2s;}
.search-input:focus{border-color:#8DC63F;}
.fpill{padding:8px 14px;border-radius:8px;border:1.5px solid rgba(255,255,255,0.08);background:transparent;color:#666;font-size:11px;font-weight:700;font-family:'Poppins',sans-serif;cursor:pointer;transition:.2s;}
.fpill.fon{background:#152a15;border-color:#22c55e;color:#22c55e;}
.fpill.foff{background:#2a0a0a;border-color:#ef4444;color:#ef4444;}

/* TABLE */
.tbl-wrap{border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.07);}
.inv-tbl{width:100%;border-collapse:collapse;font-size:13px;}
.inv-tbl th{background:rgba(255,255,255,0.04);padding:10px 14px;text-align:left;font-family:'Poppins',sans-serif;font-size:10px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid rgba(255,255,255,0.07);}
.inv-tbl td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.04);color:#bbb;vertical-align:middle;}
.inv-tbl tr:last-child td{border-bottom:none;}
.inv-tbl tr:hover td{background:rgba(255,255,255,0.02);}
.casa-n{font-family:'Poppins',sans-serif;font-weight:700;color:#fff;font-size:14px;}
.pb{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;font-family:'Poppins',sans-serif;}
.pb-q{background:rgba(244,164,147,0.12);color:#F4A493;}
.pb-qp{background:rgba(135,206,235,0.12);color:#87CEEB;}
.pb-qr{background:rgba(152,212,163,0.12);color:#98D4A3;}
.pb-fa{background:rgba(255,165,0,0.12);color:#ffa500;}

/* TOGGLE */
.tog-wrap{display:flex;align-items:center;gap:10px;justify-content:center;}
.tog{position:relative;width:48px;height:26px;cursor:pointer;}
.tog input{opacity:0;width:0;height:0;}
.tog-sl{position:absolute;inset:0;border-radius:26px;transition:.25s;background:#2a0a0a;border:1.5px solid #ef4444;}
.tog-sl::before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#ef4444;left:3px;top:2px;transition:.25s;}
.tog input:checked + .tog-sl{background:#152a15;border-color:#22c55e;}
.tog input:checked + .tog-sl::before{transform:translateX(22px);background:#22c55e;}
.tog-lbl{font-size:11px;font-weight:700;font-family:'Poppins',sans-serif;min-width:70px;}
.tog-lbl.d{color:#22c55e;}
.tog-lbl.nd{color:#ef4444;}

/* SAVING OVERLAY */
.saving-row td{opacity:.5;pointer-events:none;}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;padding:11px 20px;border-radius:10px;font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;z-index:9999;transform:translateY(60px);transition:.3s;opacity:0;white-space:nowrap;}
.toast.ok{background:rgba(34,197,94,0.95);color:#fff;}
.toast.err{background:rgba(239,68,68,0.95);color:#fff;}
.toast.show{transform:none;opacity:1;}

/* SKELETON */
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,0.04) 25%,rgba(255,255,255,0.08) 50%,rgba(255,255,255,0.04) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.sk-row{height:42px;margin-bottom:1px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">🏡 RESIDENCIAL LOS QUETZALES</div>
    <div class="login-title">Panel de Administración</div>
    <div class="login-sub">Acceso restringido · Credenciales Supabase</div>
    <label class="login-label" for="emailInp">Correo electrónico</label>
    <input class="login-input" type="email" id="emailInp" placeholder="admin@losquetzales.com" autocomplete="email">
    <label class="login-label" for="pwdInp">Contraseña</label>
    <input class="login-input" type="password" id="pwdInp" placeholder="••••••••" autocomplete="current-password">
    <button class="login-btn" id="loginBtn" onclick="doLogin()">Ingresar</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ADMIN -->
<div id="adminScreen">
  <div class="topbar">
    <div>
      <div class="topbar-brand">🏡 Admin · Los Quetzales</div>
      <div class="topbar-user" id="topbarUser">—</div>
    </div>
    <div class="topbar-actions">
      <span class="realtime-badge"><span class="realtime-dot"></span>Tiempo real activo</span>
      <button class="btn-outline-sm" onclick="doLogout()">Salir</button>
    </div>
  </div>

  <div class="admin-wrap">
    <div class="stats-bar" id="statsBar">
      <div class="stat-box skeleton sk-row"></div>
      <div class="stat-box skeleton sk-row"></div>
      <div class="stat-box skeleton sk-row"></div>
    </div>

    <div class="tabs">
      <button class="tab active-g" id="tab2" onclick="switchMza(2)">🟢 Manzana 2 — Tucán</button>
      <button class="tab" id="tab3" onclick="switchMza(3)">🔥 Manzana 3 — Ave del Paraíso</button>
    </div>

    <div class="search-row">
      <input class="search-input" type="text" id="searchInp" placeholder="Buscar casa o prototipo…" oninput="renderTable()">
      <button class="fpill" id="fAll" onclick="setFilter('todos')">Todos</button>
      <button class="fpill fon" id="fDisp" onclick="setFilter('disponible')">✅ Disponibles</button>
      <button class="fpill foff" id="fNdisp" onclick="setFilter('no-disponible')">🔴 En proceso</button>
    </div>

    <div class="tbl-wrap">
      <table class="inv-tbl">
        <thead>
          <tr>
            <th>#Casa</th><th>Prototipo</th><th>Const.</th><th>Terreno</th><th>Entrega</th>
            <th style="text-align:center;">Estatus</th><th style="text-align:center;">Guardado</th>
          </tr>
        </thead>
        <tbody id="adminTbody">
          <tr><td colspan="7" style="padding:28px;text-align:center;color:#444;">Cargando…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPA_URL = 'https://mxucntphfihiyctxiffs.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14dWNudHBoZmloaXljdHhpZmZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1OTI0NjgsImV4cCI6MjA4ODE2ODQ2OH0.O8laFOL5q-J5f5qIAN1TenRa2Ax2U53XIxR-VOw4LZY';
const TABLE   = 'inventario_quetzales';

const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

let data = [];
let currentMza = 2;
let currentFilter = 'todos';

// ── Enter key en login
['emailInp','pwdInp'].forEach(id =>
  document.getElementById(id).addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); })
);

// ── LOGIN ─────────────────────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('emailInp').value.trim();
  const pwd   = document.getElementById('pwdInp').value;
  const btn   = document.getElementById('loginBtn');
  const err   = document.getElementById('loginErr');

  if (!email || !pwd) { showErr('Ingresa correo y contraseña'); return; }

  btn.disabled = true;
  btn.textContent = 'Verificando…';
  err.style.display = 'none';

  const { data: authData, error } = await sb.auth.signInWithPassword({ email, password: pwd });

  if (error) {
    showErr('⚠ ' + (error.message === 'Invalid login credentials' ? 'Credenciales incorrectas' : error.message));
    btn.disabled = false;
    btn.textContent = 'Ingresar';
    return;
  }

  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminScreen').style.display = 'block';
  document.getElementById('topbarUser').textContent = authData.user.email;

  await loadData();
  subscribeRealtime();
}

function showErr(msg) {
  const e = document.getElementById('loginErr');
  e.textContent = msg;
  e.style.display = 'block';
}

// ── LOGOUT ────────────────────────────────────────────────────
async function doLogout() {
  await sb.auth.signOut();
  document.getElementById('adminScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('pwdInp').value = '';
  document.getElementById('loginBtn').disabled = false;
  document.getElementById('loginBtn').textContent = 'Ingresar';
  data = [];
}

// ── LOAD DATA ─────────────────────────────────────────────────
async function loadData() {
  const { data: rows, error } = await sb.from(TABLE).select('*').order('mza').order('casa');
  if (error) { showToast('Error cargando datos: ' + error.message, 'err'); return; }
  data = rows.map(r => ({...r,
    mza: r.mza, casa: r.casa, privada: r.privada,
    prototipo: r.prototipo, m2_const: r.m2_const,
    m2_terreno: r.m2_terreno, entrega: r.entrega, estatus: r.estatus
  }));
  renderStats();
  renderTable();
}

// ── REALTIME ──────────────────────────────────────────────────
function subscribeRealtime() {
  sb.channel('inventario_changes')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: TABLE }, payload => {
      const idx = data.findIndex(e => e.id === payload.new.id);
      if (idx >= 0) data[idx] = { ...data[idx], ...payload.new };
      renderStats();
      renderTable();
    })
    .subscribe();
}

// ── STATS ─────────────────────────────────────────────────────
function renderStats() {
  const disp  = data.filter(e => e.estatus === 'disponible').length;
  const ndisp = data.filter(e => e.estatus === 'no-disponible').length;
  const m2d   = data.filter(e => e.mza === 2 && e.estatus === 'disponible').length;
  const m3d   = data.filter(e => e.mza === 3 && e.estatus === 'disponible').length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-box"><div class="stat-n">${data.length}</div><div class="stat-l">Total unidades</div></div>
    <div class="stat-box"><div class="stat-n">${disp}</div><div class="stat-l">Disponibles</div></div>
    <div class="stat-box"><div class="stat-n red">${ndisp}</div><div class="stat-l">En proceso</div></div>
    <div class="stat-box"><div class="stat-n sm">${m2d}</div><div class="stat-l">M2 Tucán disp.</div></div>
    <div class="stat-box"><div class="stat-n sm">${m3d}</div><div class="stat-l">M3 Ave disp.</div></div>`;
}

// ── TABS / FILTROS ────────────────────────────────────────────
function switchMza(mza) {
  currentMza = mza;
  document.getElementById('tab2').className = 'tab' + (mza===2 ? ' active-g' : '');
  document.getElementById('tab3').className = 'tab' + (mza===3 ? ' active-o' : '');
  renderTable();
}

function setFilter(f) {
  currentFilter = f;
  document.getElementById('fAll').className  = 'fpill' + (f==='todos' ? ' fon' : '');
  document.getElementById('fDisp').className = 'fpill' + (f==='disponible' ? ' fon' : '');
  document.getElementById('fNdisp').className= 'fpill' + (f==='no-disponible' ? ' foff' : '');
  renderTable();
}

// ── TABLA ─────────────────────────────────────────────────────
function protoBadge(p) {
  if (p.includes('ROOF'))   return `<span class="pb pb-qr">${p}</span>`;
  if (p.includes('F.A.') || p.includes('QUETZA PLUS F')) return `<span class="pb pb-fa">${p}</span>`;
  if (p.includes('PLUS'))   return `<span class="pb pb-qp">${p}</span>`;
  return `<span class="pb pb-q">${p}</span>`;
}

function renderTable() {
  const q = document.getElementById('searchInp').value.toLowerCase();
  let rows = data.filter(e => e.mza === currentMza);
  if (currentFilter !== 'todos') rows = rows.filter(e => e.estatus === currentFilter);
  if (q) rows = rows.filter(e =>
    String(e.casa).includes(q) ||
    (e.prototipo||'').toLowerCase().includes(q)
  );

  if (!rows.length) {
    document.getElementById('adminTbody').innerHTML =
      `<tr><td colspan="7" style="padding:28px;text-align:center;color:#444;">Sin resultados</td></tr>`;
    return;
  }

  document.getElementById('adminTbody').innerHTML = rows.map(e => `
    <tr id="row-${e.id}">
      <td><span class="casa-n">Casa ${e.casa}</span></td>
      <td>${protoBadge(e.prototipo||'')}</td>
      <td>${e.m2_const} m²</td>
      <td>${e.m2_terreno} m²</td>
      <td style="font-size:12px;color:#555;">${e.entrega||'—'}</td>
      <td style="text-align:center;">
        <div class="tog-wrap">
          <label class="tog">
            <input type="checkbox" ${e.estatus==='disponible'?'checked':''}
              onchange="toggleEstatus(${e.id}, ${e.mza}, ${e.casa}, this.checked, this)">
            <span class="tog-sl"></span>
          </label>
          <span class="tog-lbl ${e.estatus==='disponible'?'d':'nd'}" id="lbl-${e.id}">
            ${e.estatus==='disponible'?'Disponible':'En proceso'}
          </span>
        </div>
      </td>
      <td style="text-align:center;font-size:11px;color:#444;" id="ts-${e.id}">
        ${e.updated_at ? new Date(e.updated_at).toLocaleString('es-MX',{month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—'}
      </td>
    </tr>`).join('');
}

// ── TOGGLE → SUPABASE ─────────────────────────────────────────
async function toggleEstatus(id, mza, casa, checked, checkbox) {
  const newEstatus = checked ? 'disponible' : 'no-disponible';

  // UI optimista
  const lbl = document.getElementById(`lbl-${id}`);
  if (lbl) { lbl.textContent = checked ? 'Disponible' : 'En proceso'; lbl.className = `tog-lbl ${checked?'d':'nd'}`; }
  checkbox.disabled = true;

  const { error } = await sb.from(TABLE)
    .update({ estatus: newEstatus, updated_at: new Date().toISOString() })
    .eq('id', id);

  checkbox.disabled = false;

  if (error) {
    // Revertir
    checkbox.checked = !checked;
    if (lbl) { lbl.textContent = !checked ? 'Disponible' : 'En proceso'; lbl.className = `tog-lbl ${!checked?'d':'nd'}`; }
    showToast(`⚠ Error: ${error.message}`, 'err');
    return;
  }

  // Actualizar data local
  const idx = data.findIndex(e => e.id === id);
  if (idx >= 0) { data[idx].estatus = newEstatus; data[idx].updated_at = new Date().toISOString(); }

  const ts = document.getElementById(`ts-${id}`);
  if (ts) ts.textContent = new Date().toLocaleString('es-MX',{month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'});

  renderStats();
  showToast(checked ? `✅ Casa ${casa} — Disponible` : `📋 Casa ${casa} — En proceso`, 'ok');
}

// ── TOAST ─────────────────────────────────────────────────────
function showToast(msg, type='ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = `toast ${type}`, 3000);
}

// ── SESSION CHECK ─────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('emailInp').focus();
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminScreen').style.display = 'block';
    document.getElementById('topbarUser').textContent = session.user.email;
    await loadData();
    subscribeRealtime();
  }
});
</script>
<script>
function toggleMenu() {
  const links = document.querySelector('.navbar-links');
  links.style.display = links.style.display === 'flex' ? 'none' : 'flex';
  links.style.flexDirection = 'column';
  links.style.position = 'absolute';
  links.style.top = '72px';
  links.style.left = '0';
  links.style.right = '0';
  links.style.background = '#fff';
  links.style.padding = '20px';
  links.style.borderBottom = '2px solid var(--orange)';
  links.style.boxShadow = '0 8px 24px rgba(0,0,0,0.1)';
}
</script>
</body>
</html>
